<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Agent Run!!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05050a;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#w{position:relative;height:100vh;height:100dvh;aspect-ratio:9/16;max-width:100vw;margin:0 auto}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;color:#fff;background:rgba(5,5,10,.94)}
.ov.on{display:flex}
#ovS{justify-content:space-between;padding:26px 20px 20px;background:linear-gradient(rgba(0,0,0,.6),transparent 22%,transparent 70%,rgba(0,0,0,.9) 88%)}
.top,.bot{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
h1{margin:0;font:italic 800 58px/.95 Georgia,"Times New Roman",serif;color:#fff;letter-spacing:2px;text-shadow:0 4px 0 #8c0f22,0 0 24px rgba(212,175,55,.5)}
h2{margin:0;font:800 26px Georgia,serif;color:#d4af37}
.tag{font-size:16px;color:#d4af37;font-style:italic}
p{margin:0;font-size:15px;line-height:1.35;max-width:310px}
.keys{font-size:14px;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;line-height:1.5}
button{font:inherit;font-weight:800;font-size:20px;padding:12px 28px;border:0;border-radius:16px;background:#d4af37;color:#1a1305;box-shadow:0 5px 0 #7a6213;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #7a6213}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{font:inherit;font-size:20px;padding:10px 14px;border-radius:12px;border:3px solid #d4af37;width:80%;text-align:center}
#big{font-size:54px;font-weight:800;color:#fff;line-height:1}
#st{font-size:18px;line-height:1.6}
ol{margin:0;padding-left:26px;text-align:left;font-size:16px;line-height:1.5;min-width:200px}
#ctl{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
#ctl button{pointer-events:auto;font-size:16px;padding:12px 18px;opacity:.85}
.panel{background:rgba(5,5,10,.74);border:1px solid rgba(212,175,55,.55);border-radius:14px;padding:10px 14px;width:270px}
.panel h3{margin:0 0 6px;font:700 15px Georgia,serif;color:#d4af37}
#rs{list-style:none;padding:0;margin:0;min-width:0;font-size:14px;line-height:1.45;text-align:left}
#rs li{display:flex;justify-content:space-between;gap:10px}
#rs li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rs li b{color:#ffd23f}
.keys{font-size:13px}
.row{display:flex;gap:8px;width:100%;justify-content:center}
.row input{width:58%;min-width:0}
.row button{padding:12px 20px}
</style></head><body>
<div id="w">
<canvas id="c" width="360" height="640"></canvas>
<div id="ctl"><button id="bj">⬆ Jump</button><button id="bs">⬇ Smash</button></div>

<div class="ov on" id="ovS">
<div class="top"><div class="tag">Steal the Quantum Chip. Escape the tower.</div><h1>Agent<br>Run!!</h1></div>
<div class="panel"><h3>Recent agents</h3><ol id="rs"></ol></div>
<div class="bot">
<div class="keys">⬇ Swipe down / S / ↓ = Smash &nbsp; ⬆ Swipe up / tap / W / Space = Jump<br>Smash the cracked floor. Stomp enemies twice. One try!</div>
<div class="row"><input id="nm" maxlength="14" placeholder="Agent name" autocomplete="off"><button id="go">Start</button></div>
</div>
</div>

<div class="ov" id="ovE">
<h2 id="em"></h2>
<div id="big">0</div>
<div id="st"></div>
<ol id="lb"></ol>
<button id="nx">Next Player</button>
</div>
</div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d'),$=id=>document.getElementById(id);
const W=360,H=640,FH=120,TOP=150,TIME=180,FONT='"Trebuchet MS","Segoe UI",Arial,sans-serif';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAL=[['#12334a','#050e16'],['#34101f','#0d0409'],['#222a36','#090c10'],['#33200c','#0d0803'],['#0e3030','#041010'],['#2a1d42','#0b0814']];
let ac=null,G,P,floors=[],parts=[],pops=[],cam=0,shake=0,run=false,clock=0,py=0,vy0=0,last=0,mode='splash',hist=[],gd=[];
const Y=i=>TOP+i*FH, R=(a,b)=>a+Math.random()*(b-a);
const O=(x,y,r,c)=>{X.fillStyle=c;X.beginPath();X.arc(x,y,r,0,7);X.fill()};

function beep(f,d,t,v){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

/* ---------- procedural building: every run is a new random tower ---------- */
function mkFloor(i){
  const f={i,holes:[],coins:[],furn:[],guards:[],gran:null,water:false,pal:PAL[i%PAL.length]};
  const zx=R(10,206);f.z=[zx,zx+144];
  if(i===0)return f;
  const d=Math.min(i/40,1);
  f.water=i>3&&Math.random()<.12;
  const x0=R(30,200),hi=Math.random()<.5,m=4+(Math.random()*3|0);
  for(let j=0;j<m;j++)f.coins.push({x:x0+j*22,o:hi?-56:-16,t:0});
  const nf=Math.random()<.8?1+(Math.random()*(1+d*2)|0):0;
  for(let k=0;k<nf;k++)f.furn.push({x:R(40,320),w:R(32,48),h:R(24,36),k:Math.random()*3|0,a:1});
  if(Math.random()<.2+d*.5){const r=Math.random(),t=r<.4?'L':r<.7?'K':'D';
    f.guards.push({t,x:R(40,320),d:Math.random()<.5?-1:1,v:t==='K'?30+d*25:t==='D'?80:35+d*40,a:1,hp:2,st:0,kt:0,kc:.5,kh:0,ch:0})}
  return f;
}
const F=i=>floors[i]||(floors[i]=mkFloor(i));
const inHole=(f,x)=>f.holes.some(h=>x>h[0]+4&&x<h[1]-4);
const inZone=(f,x)=>!f.holes.length&&x>f.z[0]+4&&x<f.z[1]-4;
const curF=()=>Math.max(0,Math.ceil((P.y-TOP-.01)/FH));
const inWater=()=>{const i=curF();return F(i).water&&P.y>Y(i)-55};

function newGame(){
  floors=[];parts=[];pops=[];hist=[];
  G={t:TIME,hp:3,gold:0,dest:0,fl:0,score:0,combo:0,ct:0,flash:0,el:0,gap:1,chip:0,ph:0,it:0,intro:false,over:false};
  P={x:110,y:Y(0),vy:0,d:1,dive:0,sm:0,inv:0,gr:true,name:'Player'};
  gd=[0,1,2].map(k=>({k,x:-40-k*38,y:Y(0),d:1,m:0,u:0,sx:0,sy:0}));
  cam=P.y-230;
}
function add(base,combo){
  if(combo){G.combo++;G.ct=1.8}
  const a=base*(1+Math.min(2,Math.floor(G.combo/4)));G.score+=a;return a;
}
const pop=(x,y,t)=>pops.push({x,y,t,l:1});
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:R(-160,160),vy:R(-260,-40),l:R(.4,.8),c,s:R(3,7)})}
function breakFloor(f,x){f.holes=[[f.z[0],f.z[1]]];burst(x,Y(f.i)+5,'#8b5a3c',22);shake=7;beep(110,.15,'sawtooth',.07)}
function hardHit(){G.gap=Math.max(.15,G.gap-.15);shake=3;burst(P.x,P.y,'#cfd8e0',6);pop(P.x,P.y-50,'Hard floor!');beep(90,.08,'square',.05)}
const stomped=(o,yy,h,w)=>Math.abs(P.x-o.x)<w/2+11&&vy0>0&&py<=yy-h+2&&P.y>yy-h;
function stompHit(o,yy,h,pts){
  if(o.hp>1){o.hp=1;o.st=3.5;pop(o.x,yy-h-8,'Dizzy! +'+add(15,1));beep(420,.12)}
  else{o.a=0;G.dest++;pop(o.x,yy-h-8,'+'+add(pts,1));burst(o.x,yy-h/2,'#cfd8e0',14);beep(300,.12)}
  P.vy=-380;P.dive=0;P.sm=0;P.gr=false;
}
function destroy(o,pts,y){o.a=0;G.dest++;pop(o.x,y-10,'+'+add(pts,1));burst(o.x,y,'#c98b4a',12);beep(300,.1)}
function hurt(dx){
  if(P.inv>0)return;
  G.hp--;P.inv=1.6;P.vy=-380;P.d=dx<0?-1:1;G.combo=0;G.gap=Math.max(.15,G.gap-.3);G.flash=.5;shake=10;pop(P.x,P.y-55,'OUCH! -1♥');beep(150,.3,'sawtooth',.07);
  if(G.hp<=0)finish('Mission failed! The agent was caught.');
}

/* ---------- controls ---------- */
function jump(){if(!run)return;const w=inWater();if(P.gr||w){P.vy=w?-300:-540;beep(520,.1,'sine')}}
function smash(){
  if(!run||P.sm)return;
  const f=F(Math.round((P.y-TOP)/FH));
  if(P.gr&&!inWater()){
    if(inZone(f,P.x)){breakFloor(f,P.x);P.y+=2;P.vy=250;P.gr=false;P.sm=1}
    else hardHit();
  }else{P.dive=1;P.sm=1;P.vy=Math.max(P.vy,inWater()?330:850)}
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown',' '].includes(k)&&run)e.preventDefault();
  if(e.repeat)return;
  if(k==='arrowup'||k==='w'||k===' ')jump();
  else if(k==='arrowdown'||k==='s')smash();
  else if(k==='enter'&&$('ovS').classList.contains('on'))$('go').click();
});
let sy=0;
$('w').addEventListener('pointerdown',e=>{sy=e.clientY});
$('w').addEventListener('pointerup',e=>{if(e.target.closest('button'))return;(e.clientY-sy>26)?smash():jump()});
$('bj').addEventListener('click',jump);$('bs').addEventListener('click',smash);

$('go').onclick=()=>{
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  newGame();P.name=$('nm').value.trim().slice(0,14)||'Player';
  $('ovS').classList.remove('on');mode='play';G.intro=true;
};
$('nx').onclick=()=>{$('ovE').classList.remove('on');$('nm').value='';newGame();mode='splash';renderRecent();$('ovS').classList.add('on');$('nm').focus()};

const SK='agentrun_scores_v1';
function loadScores(){try{const a=JSON.parse(localStorage.getItem(SK)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveScores(a){try{localStorage.setItem(SK,JSON.stringify(a.slice(-200)))}catch(e){}}
function renderRecent(){
  const ol=$('rs');ol.innerHTML='';
  const r=loadScores().slice(-10).reverse();
  if(!r.length){const li=document.createElement('li');li.textContent='No scores yet. Be the first agent!';ol.appendChild(li);return}
  r.forEach(x=>{const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('b');a.textContent=x.n;b.textContent=x.s;li.append(a,b);ol.appendChild(li)});
}
function finish(msg){
  G.over=true;run=false;
  $('em').textContent=msg;$('big').textContent=G.score;
  $('st').innerHTML='🪙 Gold: <b>'+G.gold+'</b><br>💥 Smashed: <b>'+G.dest+'</b><br>🏢 Floors: <b>'+G.fl+'</b>';
  const all=loadScores(),me={n:P.name,s:G.score,id:Date.now()};all.push(me);saveScores(all);
  const top=all.slice().sort((a,b)=>b.s-a.s).slice(0,5),ol=$('lb');ol.innerHTML='';
  top.forEach(r=>{const li=document.createElement('li');li.textContent=r.n+' – '+r.s;if(r.id===me.id)li.style.color='#ffd23f';ol.appendChild(li)});
  setTimeout(()=>$('ovE').classList.add('on'),700);
}

/* ---------- game logic ---------- */
function hitObj(o,yy){
  const h=o.h,w=o.w,dx=P.x-o.x;
  if(stomped(o,yy,h,w)){destroy(o,25,yy-h/2);return}
  if(Math.abs(dx)<w/2+11&&P.y>yy-h&&P.y<=yy+6){P.d=dx<0?-1:1;P.x=o.x+(dx<0?-1:1)*(w/2+11)}
}
function update(dt){
  if(G.over)return;
  G.t-=dt;if(G.t<=0){finish('Time is up! The mission failed.');return}
  G.ct-=dt;if(G.ct<=0)G.combo=0;P.inv-=dt;G.el+=dt;G.gap=Math.min(1,G.gap+.05*dt);trail(dt);
  const w=inWater();
  P.x+=P.d*(w?55:95+Math.min(G.fl,50)*1.1)*dt;
  if(P.x<18){P.x=18;P.d=1}if(P.x>W-18){P.x=W-18;P.d=-1}
  P.vy+=(w?520:1500)*dt;
  const mx=P.dive?900:(w?170:720);if(P.vy>mx)P.vy=mx;
  vy0=P.vy;py=P.y;P.y+=P.vy*dt;P.gr=false;
  if(P.vy>=0){
    const c0=Math.max(0,Math.floor((py-TOP)/FH));
    for(let i=c0;i<=c0+2;i++){
      const yy=Y(i);
      if(py<=yy+.01&&P.y>=yy&&!inHole(F(i),P.x)){
        if(P.dive&&inZone(F(i),P.x)){breakFloor(F(i),P.x);P.dive=0}
        else{P.y=yy;P.vy=0;P.gr=true;P.sm=0;if(P.dive){P.dive=0;hardHit()}}
        break;
      }
    }
  }
  const ci=curF();
  while(G.fl<ci){G.fl++;add(20,0)}
  for(let i=Math.max(0,ci-1);i<=ci;i++){
    const f=F(i),yy=Y(i);
    f.coins.forEach(c=>{if(!c.t&&Math.abs(P.x-c.x)<17&&Math.abs(P.y-18-(yy+c.o))<24){c.t=1;G.gold++;pop(c.x,yy+c.o,'+'+add(10,1));beep(880+G.combo*50,.07,'sine')}});
    f.furn.forEach(o=>{if(o.a)hitObj(o,yy)});
    f.guards.forEach(o=>{
      if(!o.a)return;
      const dx=P.x-o.x,near=P.y>yy-70&&P.y<=yy+6;
      if(o.st>0)o.st-=dt;
      else if(o.t==='K'){
        o.kc-=dt;
        if(o.kt>0){o.kt-=dt;if(o.kt<=.25&&!o.kh){o.kh=1;const al=dx*o.d;if(al>-8&&al<50&&P.y>yy-34&&P.y<=yy+6)hurt(dx)}if(o.kt<=0){o.kc=1.3;o.kh=0}}
        else{o.x+=o.d*o.v*dt;if(o.x<20||o.x>340)o.d*=-1;if(o.kc<=0&&near&&Math.abs(dx)<85){o.d=dx>0?1:-1;o.kt=.7;o.kh=0}}
      }else if(o.t==='D'){
        o.ch=near&&Math.abs(dx)<150?1:0;if(o.ch)o.d=dx>0?1:-1;
        o.x+=o.d*(o.ch?200:80)*dt;if(o.x<20){o.x=20;o.d=1}if(o.x>340){o.x=340;o.d=-1}
      }else{o.x+=o.d*o.v*dt;if(o.x<20||o.x>340)o.d*=-1}
      const hh=o.t==='D'?28:o.t==='K'?46:40,ww=o.t==='D'?36:30;
      if(stomped(o,yy,hh,ww)){stompHit(o,yy,hh,50);return}
      if(o.st>0)return;
      if(o.t==='L'){const al=dx*o.d;if(al>-26&&al<44&&P.y>yy-38&&P.y<=yy+6)hurt(dx)}
      else if(o.t==='D'){if(Math.abs(dx)<26&&P.y>yy-24&&P.y<=yy+6)hurt(dx)}
      else if(Math.abs(dx)<22&&P.y>yy-30&&P.y<=yy+6)hurt(dx);
    });
  }
}

const hAt=t=>{for(let i=hist.length-1;i>=0;i--)if(hist[i].t<=t)return hist[i];return hist[0]};
function trail(dt){
  hist.push({t:G.el,x:P.x,y:P.y,d:P.d});while(hist.length>1&&hist[0].t<G.el-6)hist.shift();
  gd.forEach(g=>{
    if(!g.m){
      g.d=P.x>g.x?1:-1;g.y=Y(0);
      if(Math.abs(P.x-g.x)>95+g.k*30)g.x+=g.d*(g.x<-5?150:85)*dt;
      if(G.fl>=1){g.m=1;g.u=0;g.sx=g.x;g.sy=g.y;if(!g.k){pop(W/2,cam+120,'Guards on your tail!');beep(260,.3,'sawtooth',.06)}}
    }else{
      const h=hAt(G.el-[1,1.7,2.4][g.k]*G.gap);g.d=h.d;
      if(g.u<1){g.u+=dt/.6;const u=Math.min(1,g.u);g.x=g.sx+(h.x-g.sx)*u;g.y=g.sy+(h.y-g.sy)*u-50*Math.sin(Math.PI*u)}
      else{g.x=h.x;g.y=h.y;if(Math.abs(P.x-g.x)<24&&Math.abs(P.y-g.y)<32){hurt(P.x-g.x);G.gap=.7}}
    }
  });
}
function introStep(dt){
  G.it+=dt;
  if(G.ph===0){P.d=1;P.x+=95*dt;if(P.x>=258){P.x=258;G.ph=1;G.chip=1;G.it=0;G.flash=.5;shake=8;beep(900,.15,'square',.05);pop(180,cam+130,'Chip stolen! Alarm!')}}
  else{trail(dt);if(G.it>1.1){G.intro=false;run=true}}
}

/* ---------- drawing ---------- */
const winX=i=>40+(i*53)%190;
function room(i){
  const f=F(i),y0=Y(i)-FH;
  if(i===0){
    const g=X.createLinearGradient(0,y0-400,0,y0+FH);g.addColorStop(0,'#04040b');g.addColorStop(1,'#4a0d22');
    X.fillStyle=g;X.fillRect(0,y0-400,W,FH+400);
    X.fillStyle='#0d0614';for(let k=0;k<6;k++)X.fillRect(k*65+5,y0+40+(k%3)*10,42,90);
    X.fillStyle='rgba(255,220,120,.5)';for(let k=0;k<14;k++)X.fillRect(12+k*25,y0+60+(k*37)%50,3,3);
    O(300,y0+30,16,'#fff3c4');return;
  }
  const g=X.createLinearGradient(0,y0,0,y0+FH);g.addColorStop(0,f.pal[0]);g.addColorStop(1,f.pal[1]);
  X.fillStyle=g;X.fillRect(0,y0,W,FH);
  X.fillStyle='rgba(212,175,55,.6)';X.fillRect(0,y0,W,3);
  X.fillStyle='rgba(0,0,0,.25)';X.fillRect(0,y0+FH-8,W,8);
  const wx=winX(i),wy=y0+22;
  X.fillStyle='#0a1830';X.fillRect(wx,wy,62,46);
  X.strokeStyle='#d4af37';X.lineWidth=2;X.strokeRect(wx,wy,62,46);X.beginPath();X.moveTo(wx+31,wy);X.lineTo(wx+31,wy+46);X.stroke();
  X.fillStyle='rgba(212,175,55,.5)';X.font='800 14px '+FONT;X.textAlign='left';X.fillText(i,10,y0+20);
}
/* helicopters: searchlight beams shine in through the windows and spill into the rooms */
function helis(){return [0,1].map(k=>{const hx=180+Math.sin(clock*.33+k*3)*190,hy=cam+70+k*62;return{hx,hy,tx:hx+Math.sin(clock*.8+k*2)*120+(k?-30:30),ty:hy+300}})}
function heliLight(a,b){
  const hs=helis();
  X.save();X.beginPath();
  for(let i=Math.max(1,a);i<=b;i++)X.rect(winX(i),Y(i)-FH+22,62,46);
  X.clip();X.globalCompositeOperation='lighter';
  hs.forEach(h=>{const g=X.createLinearGradient(h.hx,h.hy,h.tx,h.ty);g.addColorStop(0,'rgba(255,250,210,.8)');g.addColorStop(1,'rgba(255,250,210,.3)');
    X.fillStyle=g;X.beginPath();X.moveTo(h.hx-5,h.hy+8);X.lineTo(h.hx+5,h.hy+8);X.lineTo(h.tx+55,h.ty);X.lineTo(h.tx-55,h.ty);X.fill()});
  X.restore();
  X.save();X.globalCompositeOperation='lighter';
  for(let i=Math.max(1,a);i<=b;i++){
    const wx=winX(i),wy=Y(i)-FH+45;
    hs.forEach(h=>{
      if(wy<h.hy||wy>h.ty)return;
      const t=(wy-h.hy)/(h.ty-h.hy),bx=h.hx+(h.tx-h.hx)*t;
      if(Math.abs(bx-(wx+31))>31+55*t)return;
      const y1=Y(i)-FH+68,y2=Y(i),sh=(h.tx-h.hx)/(h.ty-h.hy)*(y2-y1);
      const gr=X.createLinearGradient(0,y1,0,y2);gr.addColorStop(0,'rgba(255,250,210,.3)');gr.addColorStop(1,'rgba(255,250,210,.04)');
      X.fillStyle=gr;X.beginPath();X.moveTo(wx,y1);X.lineTo(wx+62,y1);X.lineTo(wx+84+sh,y2);X.lineTo(wx-22+sh,y2);X.fill();
    });
  }
  X.restore();
}
function drawHeli(x,y,s){
  X.save();X.translate(x,y);X.scale(s,s);
  X.fillStyle='#0a0a12';X.beginPath();X.ellipse(0,0,24,10,0,0,7);X.fill();
  X.fillRect(18,-3,34,5);X.fillRect(48,-12,3,14);X.fillRect(-3,-14,6,5);
